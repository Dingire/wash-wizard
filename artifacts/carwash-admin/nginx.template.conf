server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service. Keep this in sync with
    # VITE_API_BASE_URL so the dashboard works even if that build-time
    # variable was not baked into the bundle.
    location /api/ {
        proxy_pass https://wash-wizard-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host wash-wizard-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routing (wouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
